[project]
name = "echo-balancer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "joblib>=1.4",
    "matplotlib>=3.11.2",
    "qiskit==2.5.2",
    "qiskit-optimization==0.7.0",
    "qiskit-aer==0.17.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
