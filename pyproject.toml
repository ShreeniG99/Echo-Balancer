[project]
name = "echo-balancer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyvista>=0.49.0",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-optimization>=0.7.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
